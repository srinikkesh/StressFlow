[project]
name = "stressFlow"
version = "0.1.0"
description = "Functionally graded TPMS lattice infill geometry generator for controlled failure modes and optimized structural performance in parts manufactured using fused-deposition modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "trimesh>=3.20.0",
    "meshio>=5.3.0",
    "scikit-fem>=8.0.0",
    "matplotlib>=3.7.0",
    "pyvista>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
